auto_patrol:
  ros__parameters:
    # Gazebo、Nav2 和 auto_patrol 必须使用同一套仿真时间。
    use_sim_time: true
    goal_frame: map
    amcl_pose_topic: /amcl_pose
    scan_topic: /scan
    odom_topic: /odom

    # 自动全局重定位：请求 AMCL 后低速旋转获取不同方向的激光观测。
    automatic_global_localization: true
    localization_timeout_sec: 130.0
    localization_position_variance_threshold: 0.25
    localization_yaw_variance_threshold: 0.10
    localization_exploration_enabled: true
    localization_cmd_vel_topic: /cmd_vel_nav
    localization_exploration_angular_speed: 0.40
    localization_exploration_max_duration_sec: 150.0
    # 起步净空要求为本值加平移距离；平移中仍持续以本值作为紧急停止下限。
    localization_exploration_linear_speed: 0.06
    localization_exploration_translation_distance: 0.25
    localization_exploration_translation_timeout_sec: 8.0
    localization_exploration_min_front_clearance: 0.45
    localization_exploration_front_sector_half_angle: 0.35
    localization_settle_duration_sec: 1.0

    # 两张 costmap 均清空后，等待当前 /scan 重新生成障碍与膨胀层。
    costmap_clear_timeout_sec: 5.0
    costmap_clear_settle_duration_sec: 2.0
    global_costmap_clear_service: /global_costmap/clear_entirely_global_costmap
    local_costmap_clear_service: /local_costmap/clear_entirely_local_costmap

    # 手动初始位姿是调试兼容模式，不能与自动全局重定位同时启用。
    use_manual_initial_pose_fallback: false
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_yaw: 0.0
    initial_pose_publish_count: 5
    initial_pose_publish_period_sec: 1.0
    initial_pose_wait_sec: 3.0

    max_retries: 1
    stable_amcl_samples: 5
    stable_position_tolerance: 0.05
    stable_yaw_tolerance: 0.10
    max_message_age_sec: 2.0
    future_message_tolerance_sec: 0.5

    # 这三个点已经在当前地图坐标系中完成过一次成功巡检。
    waypoint_1: [-0.414, 1.41, 0.0]
    waypoint_2: [1.75, -0.535, 1.57]
    waypoint_3: [0.318, -1.81, 3.14]
